seed: 42
use_wandb: false
wandb:
  project: null
  entity: null
run_name: superdec_fleet_small
dataset: shapenet
device: cuda
checkpoints:
  resume_from: null
  keep_epoch: false
superdec:
  decoder:
    n_queries: 4
    n_layers: 2
    n_heads: 1
    masked_attention: false
    swapped_attention: false
    dim_feedforward: 128
    deep_supervision: false
    pos_encoding_type: sinusoidal
  point_encoder:
    in_channels: 3
    out_channels: 32
    kernel_size: 3
    resolution: 16
    voxelization:
      normalize: true
      eps: 0
    l1:
      in_channels: 3
      out_channels: 64
      kernel_size: 3
      resolution: 32
      voxelization:
        normalize: true
        eps: 0
    l2:
      in_channels: 64
      out_channels: 32
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: true
        eps: 0
    l3:
      in_channels: 32
      out_channels: 32
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: true
        eps: 0
shapenet:
  path: data/fleet
  categories: null
  normalize: false
trainer:
  save_path: checkpoints/superdec_fleet_small
  save_every_n_epochs: 10
  num_epochs: 80
  batch_size: 32
  num_workers: 0
  evaluate_every_n_epochs: 1
  augmentations: true
optimizer:
  lr: 0.0004
  weight_decay: 0
  betas:
  - 0.9
  - 0.999
  enable_scheduler: true
  only_heads: false
scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: ${optimizer.lr}
  epochs: ${trainer.num_epochs}
  steps_per_epoch: 235
loss:
  n_samples: 500
  w_sps: 0.1
  w_ext: 0.01
  w_cub: 1.0
  w_cd: 1.0
visualization:
  res_primitives: 40
