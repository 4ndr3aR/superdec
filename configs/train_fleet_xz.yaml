# SuperDec on the randx64 fleet via the RAW .xz surface clouds (2026-10-26) -- the dataloader BACKPORT.
#
# Identical model / loss / scheduler to train_fleet.yaml (the completed NPZ fleet run, 0.28M params, 80 ep),
# the ONLY change being the data source: `dataset: xzfleet` -> ShapeNetXZ, which reads each object's
# 4096-point canonical surface block (obj_k_surface_pts) straight from the scene's vt3learn_cache/
# bundle_index.xz (the platform's XZM-1 archive, read by the vendored superdec/data/xzm.py) and derives
# per-point normals by kNN+PCA (the .xz carries points only; the cuboid term w_cub wants them).
#
# Splits are the PLATFORM's scene lists (data/xzfleet_splits/{train,val,test}.txt -- the same 2320/270/140
# -scene "2370" dataset the platform trains on), enumerated per-object -> 7098 train / 821 val object
# clouds. Normalization (normalize: False) is the verbatim NPZ fleet regime the checkpoint was trained in.
hydra:
  run:
    dir: .

seed: 42
use_wandb: false
wandb:
  project:
  entity:
run_name: superdec_fleet_xz

dataset: xzfleet
device: cuda

checkpoints:
  resume_from:
  keep_epoch: False

superdec:
  decoder:
    n_queries: 4
    n_layers: 2
    n_heads: 1
    masked_attention: false
    swapped_attention: false
    dim_feedforward: 128
    deep_supervision: False
    pos_encoding_type: sinusoidal
  point_encoder:
    in_channels: 3
    out_channels: 32
    kernel_size: 3
    resolution: 16
    voxelization:
      normalize: True
      eps: 0
    l1:
      in_channels: 3
      out_channels: 64
      kernel_size: 3
      resolution: 32
      voxelization:
        normalize: True
        eps: 0
    l2:
      in_channels: 64
      out_channels: 32
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0
    l3:
      in_channels: 32
      out_channels: 32
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0

shapenet:
  xz_fleet: /mnt/shared/ubuntu-sidecar-pod/hermes-video-to-3d/output/randx64_fleet_64x64
  xzfleet_splits_dir: /mnt/shared/ubuntu-sidecar-pod/superdec/data/xzfleet_splits
  xz_n_knn: 16
  normalize: False          # raw canonical clouds; the voxel encoder's normalize:true rescales (NPZ regime)

trainer:
  save_path: checkpoints
  save_every_n_epochs: 10
  num_epochs: 80
  batch_size: 32
  num_workers: 0            # 63MB /dev/shm on this pod -> no multiproc workers
  evaluate_every_n_epochs: 1
  augmentations: True

optimizer:
  lr: 4e-4
  weight_decay: 0
  betas: [0.9, 0.999]
  enable_scheduler: True
  only_heads: False

scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: ${optimizer.lr}
  epochs: ${trainer.num_epochs}
  steps_per_epoch: 222     # 7098 train objects / bs32 (ceil). train.py overwrites with len(loader) at build.

loss:
  n_samples: 500
  w_sps: 0.1
  w_ext: 0.01
  w_cub: 1.0
  w_cd: 1.0

visualization:
  res_primitives: 40
