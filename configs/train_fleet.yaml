# SuperDec on the randx64 fleet — SMALLEST configuration (2026-10-22).
#
# Rationale for "smallest":
#   * Each fleet object is a single near-superquadric primitive (7 classes), so the
#     default n_queries=16 is far beyond what one object needs; n_queries=4 leaves
#     headroom for the torus (one closed tube can be over-segmented) and for the
#     1-5 object *scenes* we may feed later. 4 queries is the minimal robust value.
#   * The 3-layer voxelconv encoder is the representational core (3D Conv at 32^3 /
#     16^3 / 16^3); its WIDTHS are the main parameter mass -> halved (64/32/32), giving
#     emb_dims = 32 everywhere downstream. (Narrowing further, or dropping a conv level,
#     loses the local-geometry inductive bias the decoder only sees through 32^3 voxels.)
#   * Transformer decoder: 2 layers (deep_supervision=False so layers 1-2 are unused),
#     1 head, feedforward 128.
#   * num_workers=0: the pod's 63MB /dev/shm makes multiprocess DataLoader workers SIGBUS.
#   * save_every_n_epochs=10 (trainer saves on (epoch+1)%save_every or last epoch).
# Keep relative paths (shapenet.path, trainer.save_path) resolved from the REPO ROOT:
# hydra by default chdirs into a fresh outputs/<timestamp>/ run dir, which would break
# "data/fleet". dir: "." pins the CWD to wherever train.py was launched from.
hydra:
  run:
    dir: .

seed: 42
use_wandb: false
wandb:
  project:
  entity:
run_name: superdec_fleet_small

dataset: shapenet
device: cuda

checkpoints:
  resume_from:
  keep_epoch: False

superdec:
  decoder:
    n_queries: 4
    n_layers: 2
    n_heads: 1
    masked_attention: false
    swapped_attention: false
    dim_feedforward: 128
    deep_supervision: False
    pos_encoding_type: sinusoidal
  point_encoder:
    in_channels: 3
    out_channels: 32
    kernel_size: 3
    resolution: 16
    voxelization:
      normalize: True
      eps: 0
    l1:
      in_channels: 3
      out_channels: 64
      kernel_size: 3
      resolution: 32
      voxelization:
        normalize: True
        eps: 0
    l2:
      in_channels: 64
      out_channels: 32
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0
    l3:
      in_channels: 32
      out_channels: 32
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0

shapenet:
  path: data/fleet          # <-- our ShapeNet-style fleet (data/fleet/<class>/<model>/pointcloud.npz)
  categories: null          # all 7: box sphere torus cone capsule cylinder pyramid
  normalize: False          # dataloader centers+scales each object to the unit cube itself

trainer:
  save_path: checkpoints
  save_every_n_epochs: 10
  num_epochs: 80
  batch_size: 32
  num_workers: 0            # 63MB /dev/shm on this pod -> no multiproc workers
  evaluate_every_n_epochs: 1
  augmentations: True

optimizer:
  lr: 4e-4
  weight_decay: 0
  betas: [0.9, 0.999]
  enable_scheduler: True
  only_heads: False

scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: ${optimizer.lr}
  epochs: ${trainer.num_epochs}
  steps_per_epoch: 235   # 7497 train objects / bs32 (ceil). torch 2.9 OneCycleLR no longer accepts
                         # the old -1 sentinel; the stock train.py overwrites this with len(loader)
                         # at build time, but a self-consistent value keeps direct/hydra instantiation
                         # (and resume) from raising ValueError.

loss:
  n_samples: 500
  w_sps: 0.1
  w_ext: 0.01
  w_cub: 1.0
  w_cd: 1.0

visualization:
  res_primitives: 40
